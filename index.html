<html lang="en">

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="ForestConnect AI: Intelligent digital platform empowering tribal and forest-dependent communities through marketplace access, ML price predictions, weather forecasts, and government schemes." />

  <body class="bg-gray-50 text-gray-900 font-sans antialiased">

    <script type="module" src="/src/main.jsx"></script>
    <script>
      // Register Service Worker for offline support
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js')
            .then((reg) => console.log('🌿 SW registered:', reg.scope))
            .catch((err) => console.log('SW registration failed:', err));
        });
      }
    </script>
  </body>
